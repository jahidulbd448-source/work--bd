<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার কাজের সময়</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-content: center;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .timer-box {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 350px;
        }
        h2 { margin-bottom: 20px; font-size: 20px; color: #38bdf8; }
        .time {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #f8fafc;
            letter-spacing: 2px;
        }
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }
        .start { background-color: #22c55e; color: white; }
        .stop { background-color: #ef4444; color: white; }
        .reset { background-color: #64748b; color: white; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="timer-box">
        <h2>⏱️ কাজের সময় ট্র্যাকার</h2>
        <div class="time" id="display">00:00</div>
        
        <button class="btn start" id="startBtn" onclick="startTimer()">শুরু করুন</button>
        <button class="btn stop" id="stopBtn" onclick="stopTimer()" style="display:none;">থামুন</button>
        <button class="btn reset" onclick="resetTimer()">রিসেট</button>
    </div>

    <script>
        let startTime, updatedTime, difference, t;
        let running = false;

        function startTimer() {
            if (!running) {
                startTime = new Date().getTime() - (difference || 0);
                t = setInterval(getShowTime, 1000);
                running = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'inline-block';
            }
        }

        function stopTimer() {
            if (running) {
                clearInterval(t);
                difference = new Date().getTime() - startTime;
                running = false;
                document.getElementById('startBtn').style.display = 'inline-block';
                document.getElementById('stopBtn').style.display = 'none';
            }
        }

        function resetTimer() {
            clearInterval(t);
            difference = 0;
            running = false;
            document.getElementById('display').innerHTML = "00:00";
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function getShowTime() {
            updatedTime = new Date().getTime();
            difference = updatedTime - startTime;
            
            let minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((difference % (1000 * 60)) / 1000);
            
            minutes = (minutes < 10) ? "0" + minutes : minutes;
            seconds = (seconds < 10) ? "0" + seconds : seconds;
            
            document.getElementById('display').innerHTML = minutes + ":" + seconds;
        }
    </script>
</body>
</html>
